name: "Goldset AI Eval Gate"
author: "Lakshyaraj Singh Rao"
description: "Run AI evals in CI: golden datasets, LLM-as-judge, structural assertions. PR delta comment, blocks merge on regression."

inputs:
  eval-dir:
    description: "Directory containing *.eval.ts files"
    required: false
    default: "evals"
  judge-provider:
    description: "Provider for LLM judge (openai | anthropic | none). When set, that provider's API key is forwarded from the runner env under its own name and GOLDSET_JUDGE_PROVIDER carries the provider name."
    required: false
    default: "none"
  comment-on-pr:
    description: "Post (or update) a results + delta comment on the pull request"
    required: false
    default: "true"
  github-token:
    description: "Token used to post the PR comment (this input wins over the GITHUB_TOKEN env var)"
    required: false
    default: ${{ github.token }}
  timeout-ms:
    description: "Per-eval wall-clock limit in milliseconds. 0 disables the limit."
    required: false
    default: "0"
  pass-env:
    description: "Comma/space-separated env var names to forward into each eval process, on top of the built-in allowlist."
    required: false
    default: ""

outputs:
  results-path:
    description: "Absolute path to the JSON results file (goldset-results.json)"
  passed:
    description: "Number of eval files that passed"
  failed:
    description: "Number of eval files that failed"
  total:
    description: "Total number of eval files run"
  all-passed:
    description: "'true' if every eval file passed"

runs:
  using: node20
  main: dist/action.cjs

branding:
  icon: "check-circle"
  color: "green"
