name: Benchmark

# Free-runner timing for the golden + structural runners (pure CPU, stub llm —
# no provider call, no API key, no cost). The LLM-judge benchmark is NOT run
# here (it costs money); it lives in bench/judge.mjs and is run on demand.
on:
  push:
    branches: [main]
    paths: ['bench/runners.mjs', 'src/runners/**', '.github/workflows/benchmark.yml']
  pull_request:
    paths: ['bench/runners.mjs', 'src/runners/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  free-runners:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run free-runner timing benchmark
        # pipefail, so a failing benchmark is not hidden behind tee
        shell: bash
        run: set -o pipefail && node bench/runners.mjs | tee bench/results.txt
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: free-runners
          path: bench/results.txt

  # Paid: one Claude Haiku call per judge case. Manual dispatch ONLY — never on
  # push/PR — so fork PRs can't touch the secret and the cost is opt-in. The key
  # is passed as an env secret, read from process.env, never logged.
  judge-cost:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - name: Run LLM-judge cost benchmark (Claude Haiku)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        shell: bash
        run: |
          set -o pipefail
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "ANTHROPIC_API_KEY is not set; nothing to measure" >&2
            exit 1
          fi
          node bench/judge.mjs | tee bench/judge-results.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: judge-cost
          path: bench/judge-results.json
