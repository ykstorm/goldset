name: 'Test Public Action'

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-action:
    name: Run Goldset action against a fixture eval dir
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci
      - run: npm run build

      - name: Run Goldset action (fixtures/evals)
        id: goldset
        uses: ./
        with:
          eval-dir: fixtures/evals
          judge-provider: none
          comment-on-pr: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify outputs
        run: |
          echo "passed=${{ steps.goldset.outputs.passed }}"
          echo "failed=${{ steps.goldset.outputs.failed }}"
          echo "total=${{ steps.goldset.outputs.total }}"
          echo "all-passed=${{ steps.goldset.outputs.all-passed }}"
          test "${{ steps.goldset.outputs.all-passed }}" = "true"
          echo "Self-test complete."
